Chinese,1,Advanced Conversational Proficiency,"Master sophisticated dialogue in professional, academic, and social contexts.",MC,"In a formal business negotiation, which phrase best demonstrates respect and openness to the other party's perspective? 我认为我的方案是最好的。(Wǒ rènwéi wǒ de fāng'àn shì zuì hǎo de.)",I believe my proposal is the best.,I would appreciate hearing your valuable insights on this matter.,Your idea has no merit compared to mine.,Let me interrupt you to explain my position.,B,Consider which response shows active listening and respect in professional settings rather than assertiveness or dismissiveness.,"Option B is correct because in sophisticated professional dialogue, demonstrating respect for the other party's perspective is crucial for successful negotiation. The phrase acknowledges the value of their input and creates a collaborative atmosphere. Option A is too assertive and closes dialogue. Option C is disrespectful and counterproductive. Option D shows poor communication etiquette by interrupting, which violates professional norms in both Western and Chinese business culture."
Chinese,1,Advanced Conversational Proficiency,"Master sophisticated dialogue in professional, academic, and social contexts.",FITB,"When delivering a formal academic presentation in Mandarin, you need to transition from your introduction to your main arguments. Complete this transitional phrase: '现在让我们___________进入本次演讲的核心内容。'",,,,,逐步/依次,Think about how to indicate moving progressively from one topic to another in an orderly fashion.,"The correct answer is '逐步' (gradually/progressively) or '依次' (in order/sequentially). These phrases indicate a systematic progression through your main points, which is essential for sophisticated academic discourse. This transitional language helps your audience follow your logical development of ideas and demonstrates command of formal register and rhetorical devices in Mandarin. Other potential answers like '立即' (immediately) would be too abrupt, while '随意' (casually) would undermine academic credibility."
Chinese,1,Advanced Conversational Proficiency,"Master sophisticated dialogue in professional, academic, and social contexts.",ORD,Arrange these debate statements in the most logically persuasive order for a formal argument in Mandarin Chinese.,提出反方观点并承认其合理之处,总结你的立场并呼吁采取行动,阐述你的主要论点和证据,首先表明你对这个议题的立场,"D,C,A,B","Consider how effective argumentation typically progresses: establishing position, building evidence, addressing counterarguments, then concluding with a call to action.","The correct sequence is D,C,A,B. In sophisticated debate and formal argumentation, you must first establish your position clearly (D), then present your main arguments with supporting evidence (C). This foundation allows you to acknowledge and address opposing viewpoints credibly (A), demonstrating intellectual honesty. Finally, you conclude by summarizing your stance and calling for action (B), which leaves a powerful impression. This structure follows classical rhetorical principles used in both Chinese and Western argumentation, creating a persuasive and logically sound presentation that appeals to educated audiences."
Chinese,2,Classical and Literary Chinese,"Study traditional Chinese literature, classical texts, and modern written Chinese to understand historical linguistic evolution and develop analytical skills for interpreting complex written works.",MC,Which classical Chinese text is considered the foundation of Confucian philosophy and consists of conversations between Confucius and his disciples?,The Art of War,The Analects,The Book of Changes,The Daodejing,B,Consider texts that focus on ethical teachings and dialogues rather than military strategy or cosmological principles.,"The Analects (論語) is the correct answer. It is a collection of sayings and ideas attributed to Confucius and his disciples, forming the core of Confucian thought. The Art of War focuses on military strategy, The Book of Changes deals with divination and cosmology, and the Daodejing emphasizes Daoist philosophy—none of these are primarily focused on Confucian ethics and dialogue."
Chinese,2,Classical and Literary Chinese,"Study traditional Chinese literature, classical texts, and modern written Chinese to understand historical linguistic evolution and develop analytical skills for interpreting complex written works.",FITB,"In classical Chinese poetry, the regulated verse form known as _______ contains eight lines with specific tonal patterns and is considered one of the highest forms of poetic achievement.",,,,,regulated verse (lüshi),Think of a form that represents the peak of technical sophistication in Tang Dynasty poetry with strict rules about rhyme and tone.,"Regulated verse (lüshi or 律詩) is the correct answer. This form emerged during the Tang Dynasty and represents the most technically refined style of classical Chinese poetry, with strict requirements for line length (typically five or seven characters per line), tonal patterns, parallelism between couplets, and rhyme schemes. It contrasts with earlier free-form poetry and demonstrates the sophisticated evolution of Chinese literary aesthetics."
Chinese,2,Classical and Literary Chinese,"Study traditional Chinese literature, classical texts, and modern written Chinese to understand historical linguistic evolution and develop analytical skills for interpreting complex written works.",ORD,Arrange the following periods of Chinese literature in chronological order from earliest to latest:,Modern Chinese Literature (20th century onward),Tang Dynasty Poetry (618-907 CE),Classical Prose Traditions (pre-Qin to Han),Song Dynasty Ci Poetry (960-1279 CE),"C,B,D,A","Remember that dynasties are generally ordered by their historical occurrence, and think about which literary forms developed first.","The correct chronological sequence is C,B,D,A. Classical Prose Traditions emerged during the pre-Qin and Han periods as the earliest significant written literature. Tang Dynasty Poetry (618-907 CE) followed, representing the golden age of classical poetry. Song Dynasty Ci Poetry (960-1279 CE) came later as a distinct poetic form that flourished during the Song period. Modern Chinese Literature (20th century onward) is the most recent, reflecting contemporary language and themes. This sequence shows the historical progression of Chinese literary development across major periods."
Chinese,3,Cultural Integration and Specialized Applications,"Integrate cultural knowledge with linguistic expertise to explore business Chinese, academic research, and specialized vocabulary in contemporary Chinese society.",MC,"In modern Chinese business contexts, what does the term '商务谈判' (shāngwù tǎnpàn) primarily refer to?",Commercial negotiation and business discussion,Social gathering for networking,Government policy meeting,Cultural exchange program,A,Think about the compound: 商务 means business/commerce and 谈判 means to negotiate or discuss terms.,"商务谈判 literally translates to 'business negotiation.' The term 商务 (shāngwù) specifically denotes commercial or business-related activities, while 谈判 (tǎnpàn) means negotiation or discussion. Option B is incorrect as it describes casual networking rather than formal business discussion. Option C is wrong because 谈判 in business contexts refers to commercial negotiation, not government policy. Option D is incorrect as this term is specifically business-focused, not cultural exchange."",FITB,When writing an academic paper in Chinese"
Mathematics,1,Advanced Calculus and Real Analysis,"Explore limits, continuity, differentiation, and integration in rigorous mathematical frameworks.",MC,What is the formal definition of the limit of a function f(x) as x approaches a value c?,"For every ε > 0, there exists a δ > 0 such that if 0 < |x - c| < δ, then |f(x) - L| < ε","For every δ > 0, there exists an ε > 0 such that if 0 < |x - c| < ε, then |f(x) - L| < δ","For every ε > 0, there exists a δ > 0 such that if 0 < |f(x) - L| < δ, then |x - c| < ε","For every δ > 0, there exists an ε > 0 such that 0 < |x - c| < δ and |f(x) - L| < ε",A,"Consider the relationship between how close x must be to c and how close f(x) must be to L. Which variable controls the tolerance for f(x), and which controls the tolerance for x?","The formal epsilon-delta definition states: lim(x→c) f(x) = L if for every ε > 0 (desired output tolerance), there exists a δ > 0 (required input tolerance) such that whenever 0 < |x - c| < δ, we have |f(x) - L| < ε. This is the foundational definition of limits in real analysis. Option B reverses the roles of ε and δ, Option C confuses which absolute value goes in the conditional, and Option D omits the logical implication structure."
Mathematics,1,Advanced Calculus and Real Analysis,"Explore limits, continuity, differentiation, and integration in rigorous mathematical frameworks.",MS,"Which of the following statements are true regarding continuous functions on a closed interval [a, b]?","A continuous function on [a, b] is uniformly continuous","A continuous function on [a, b] must be bounded","A continuous function on [a, b] attains its maximum and minimum values","A continuous function on [a, b] must be differentiable at every point","A,B,C",Review the Extreme Value Theorem and the definition of uniform continuity. Also consider whether continuity implies differentiability (think of f(x) = |x| at x = 0).,"By the Heine-Cantor Theorem, any continuous function on a compact set like [a, b] is uniformly continuous (A is correct). The Extreme Value Theorem guarantees that a continuous function on [a, b] attains both maximum and minimum values (C is correct). A bounded continuous function on a closed interval is indeed bounded (B is correct). However, continuity does not imply differentiability everywhere; the absolute value function is continuous but not differentiable at x = 0, making D false."
Mathematics,1,Advanced Calculus and Real Analysis,"Explore limits, continuity, differentiation, and integration in rigorous mathematical frameworks.",FITB,"If a sequence {aₙ} converges to L, then for every ε > 0, there exists a natural number N such that for all n > N, we have ____________________.",,,,|aₙ - L| < ε,Consider what it means for the distance between a term and the limit to become arbitrarily small. How would you express 'the terms are within ε of L'?,"The definition of sequence convergence requires that for every positive epsilon (no matter how small), we can eventually reach a point N in the sequence beyond which all terms remain within epsilon distance from the limit L. This is formalized as |aₙ - L| < ε for all n > N. This is the precise mathematical meaning of convergence and forms the basis for all limit operations in real analysis.",
Mathematics,2,Linear Algebra and Abstract Structures,"Master vector spaces, matrices, eigenvalues, eigenvectors, and linear transformations. Introduce group theory, rings, and fields as fundamental algebraic structures used across advanced mathematics.",MC,"If A is a 3×3 matrix with eigenvalue λ = 2, which of the following statements must be true?",The determinant of A is 2,There exists a non-zero vector v such that Av = 2v,The trace of A equals 2,A is diagonalizable,B,"Consider what the definition of an eigenvalue and eigenvector tells you: if λ is an eigenvalue, then there must exist a corresponding non-zero eigenvector.","The correct answer is B. By definition, if λ is an eigenvalue of matrix A, then there exists a non-zero vector v (called an eigenvector) such that Av = λv. In this case, with λ = 2, we have Av = 2v. Option A is incorrect because the determinant depends on all eigenvalues, not just one. Option C is incorrect because the trace equals the sum of all eigenvalues, not necessarily any single one. Option D is incorrect because having one real eigenvalue does not guarantee diagonalizability without additional information."
Mathematics,2,Linear Algebra and Abstract Structures,"Master vector spaces, matrices, eigenvalues, eigenvectors, and linear transformations. Introduce group theory, rings, and fields as fundamental algebraic structures used across advanced mathematics.",FITB,"A set G with operation * forms a group if it satisfies closure, associativity, existence of an identity element, and existence of ___________ for each element.",,,,,inverse elements,Remember that groups must allow every element to be undone by another element in the set.,"The answer is inverse elements. In group theory, the four group axioms are: (1) Closure—the operation on any two elements produces an element in G; (2) Associativity—(a*b)*c = a*(b*c); (3) Identity element—there exists e such that e*a = a*e = a for all a; and (4) Inverse elements—for every a in G, there exists a⁻¹ such that a*a⁻¹ = a⁻¹*a = e. Without the existence of inverse elements, the structure would be a monoid rather than a group."
Mathematics,2,Linear Algebra and Abstract Structures,"Master vector spaces, matrices, eigenvalues, eigenvectors, and linear transformations. Introduce group theory, rings, and fields as fundamental algebraic structures used across advanced mathematics.",MS,Which of the following are properties of a vector space V over a field F? (Select all that apply),"For any scalar c ∈ F and vector v ∈ V, the scalar multiple cv is also in V",There exists a zero vector 0 ∈ V such that v + 0 = v for all v ∈ V,Addition of vectors is commutative,Vector addition is associative with the field operation of multiplication,"A,B,C","Recall the ten axioms of vector spaces. Consider which properties relate specifically to the structure of vectors and scalars, and which relate to the algebraic operations defined on the vector space.","The correct answer is A, B, C. These are all standard vector space axioms. Option A describes closure under scalar multiplication. Option B describes the existence of the additive identity (zero vector). Option C is the commutativity of vector addition. Option D is incorrect because it conflates vector addition with scalar multiplication—while both must be associative, they are separate operations, and the statement as written does not correctly describe a vector space axiom."
Mathematics,3,Applied Mathematics and Problem Solving,"Apply mathematical theory to differential equations, optimization, numerical methods, and real-world modeling to develop computational skills for solving complex mathematical problems.",MC,A cylindrical tank with radius 2 meters is being filled with water at a rate of 5 cubic meters per minute. How fast is the water level rising when the water depth is 3 meters?,5/(4π) meters per minute,5/(2π) meters per minute,10/(4π) meters per minute,5/π meters per minute,B,Recall that the volume of a cylinder is V = πr²h. Use the chain rule: dV/dt = πr²(dh/dt). Solve for dh/dt given the known values.,"The volume of a cylinder is V = πr²h. Taking the derivative with respect to time: dV/dt = πr²(dh/dt). Since dV/dt = 5 m³/min and r = 2 meters, we have 5 = π(2)²(dh/dt) = 4π(dh/dt). Therefore, dh/dt = 5/(4π) meters per minute. Option B is incorrect because it uses r instead of r². Options C and D result from arithmetic errors in simplifying the expression."
Mathematics,3,Applied Mathematics and Problem Solving,"Apply mathematical theory to differential equations, optimization, numerical methods, and real-world modeling to develop computational skills for solving complex mathematical problems.",FITB,"A company's revenue function is R(x) = 120x - 2x², where x is the number of units sold. Find the number of units that maximizes revenue.",,,,,30,"To find the maximum, take the derivative of R(x), set it equal to zero, and solve for x. Remember that a quadratic with a negative leading coefficient has a maximum at its vertex.","To maximize revenue, we find the critical point by computing dR/dx = 120 - 4x and setting it equal to zero. Solving 120 - 4x = 0 gives x = 30 units. The second derivative d²R/dx² = -4 < 0 confirms this is a maximum. Therefore, the company should sell 30 units to maximize revenue."
Mathematics,3,Applied Mathematics and Problem Solving,"Apply mathematical theory to differential equations, optimization, numerical methods, and real-world modeling to develop computational skills for solving complex mathematical problems.",MS,Which of the following methods are appropriate for solving nonlinear differential equations numerically? Select all that apply.,Euler's method,Exact symbolic integration,Runge-Kutta method,Separation of variables,"A,C",Consider which techniques do not require finding an analytical closed-form solution. Think about methods that approximate solutions step-by-step rather than solving algebraically.,"Euler's method and Runge-Kutta method are both numerical techniques that approximate solutions to differential equations by taking small steps forward in time, making them suitable for nonlinear equations where analytical solutions may not exist. Exact symbolic integration and separation of variables are analytical methods that work only when the differential equation can be solved in closed form, which is rarely possible for nonlinear equations. Therefore, options A and C are correct."
Introduction to Database,1,Fundamentals of Database Systems,"Introduction to core database concepts including data organization, database architecture, and the role of databases in modern applications.",MC,What is the primary purpose of a Database Management System (DBMS)?,To store data in random files across multiple servers,"To provide an organized way to store, retrieve, and manage data efficiently",To eliminate the need for data backup and recovery,To replace all file-based storage systems permanently,B,Consider what makes databases better than storing data in separate files.,"A DBMS serves as an intermediary between users and the actual data storage, providing organized methods for data management. Option A is incorrect because DBMS doesn't necessarily use random file storage. Option C is wrong as DBMS still requires backup strategies. Option D is too absolute; DBMS complements rather than completely replaces all storage methods."
Introduction to Database,1,Fundamentals of Database Systems,"Introduction to core database concepts including data organization, database architecture, and the role of databases in modern applications.",FITB,A ________ is a collection of related data organized and stored in a structured format.,,,,,database,Think about what term describes an organized collection of data.,"A database is fundamentally a structured collection of related data. Unlike random data scattered across files, a database maintains relationships between data elements and organizes them according to a specific schema or structure, allowing for efficient retrieval and management."
Introduction to Database,1,Fundamentals of Database Systems,"Introduction to core database concepts including data organization, database architecture, and the role of databases in modern applications.",MS,Which of the following are key components of a DBMS architecture? (Select all that apply),Query Processor and Optimization Engine,Random data allocation module,Storage Engine and File Manager,Data Dictionary and Metadata Manager,"A,C,D",Recall which components are essential for DBMS to function properly and manage data.,"The Query Processor optimizes user queries for efficient execution (A), the Storage Engine manages how data is physically stored (C), and the Data Dictionary maintains metadata about database structure (D). Option B is incorrect as DBMS uses structured allocation, not random allocation of data across storage systems."
Introduction to Database,2,Relational Databases and SQL,"Exploration of the relational database model, table structures, and relationships. Students will learn SQL basics including SELECT queries, filtering, joining tables, and data manipulation to retrieve and manage information effectively.",MC,Which of the following best describes a primary key in a relational database?,A field that can contain duplicate values across multiple rows,A unique identifier that uniquely identifies each record in a table,An index that speeds up query performance on any column,A constraint that ensures referential integrity between tables,B,Think about what makes each row unique and distinguishable from others in a table.,"A primary key is a unique identifier that ensures each record in a table can be uniquely identified. Option B is correct because primary keys must contain unique values with no duplicates, allowing the database to distinguish between individual records. Option A is incorrect because primary keys explicitly prevent duplicate values. Option C confuses primary keys with indexes, which are separate database objects used for performance optimization. Option D describes foreign keys or referential integrity constraints, not primary keys themselves."
Introduction to Database,2,Relational Databases and SQL,"Exploration of the relational database model, table structures, and relationships. Students will learn SQL basics including SELECT queries, filtering, joining tables, and data manipulation to retrieve and manage information effectively.",FITB,Write the SQL command to retrieve all columns from a table named 'Students' where the age is greater than 20.,,,,,SELECT * FROM Students WHERE age > 20;,"Remember the basic SQL structure: SELECT (columns), FROM (table name), WHERE (condition).","The correct answer is 'SELECT * FROM Students WHERE age > 20;'. This query demonstrates fundamental SQL syntax: SELECT * retrieves all columns, FROM Students specifies the table, and WHERE age > 20 filters rows to include only records where the age value exceeds 20. The asterisk (*) is a wildcard representing all columns, and the semicolon (;) terminates the statement."
Introduction to Database,2,Relational Databases and SQL,"Exploration of the relational database model, table structures, and relationships. Students will learn SQL basics including SELECT queries, filtering, joining tables, and data manipulation to retrieve and manage information effectively.",MS,Which of the following are characteristics of the relational database model? (Select all that apply),Data is organized in tables with rows and columns,Relationships between tables are established using foreign keys,Data can only be queried through non-structured query languages,Normalization reduces data redundancy and improves data integrity,"A,B,D",Consider what makes relational databases structured and how they handle data organization and relationships.,"The correct answers are A, B, and D. Option A is correct because relational databases organize data into tables (relations) with rows (tuples) and columns (attributes). Option B is correct because foreign keys establish relationships and maintain referential integrity between tables. Option D is correct because normalization is a fundamental principle of relational database design that eliminates redundancy and maintains data consistency. Option C is incorrect because SQL (Structured Query Language) is the standard, structured language for querying relational databases, not non-structured languages."
Introduction to Database,3,Database Design and Normalization,"Principles of effective database design including entity-relationship modeling, schema design, and normalization techniques. Students will learn to create well-structured databases that minimize redundancy and maintain data integrity.",MC,What is the primary goal of database normalization?,To increase the number of tables in a database,To minimize data redundancy and maintain data integrity,To make queries run faster,To convert all data into text format,B,Think about what normalization helps prevent in databases.,Normalization aims to minimize data redundancy and maintain data integrity by organizing data into well-structured tables. Option A is incorrect because normalization doesn't focus on increasing tables arbitrarily. Option C is partially related but not the primary goal. Option D is incorrect as normalization doesn't convert data types but organizes structure.
Introduction to Database,3,Database Design and Normalization,"Principles of effective database design including entity-relationship modeling, schema design, and normalization techniques. Students will learn to create well-structured databases that minimize redundancy and maintain data integrity.",ORD,What is the correct sequence of normalization forms?,First Normal Form (1NF),Second Normal Form (2NF),Third Normal Form (3NF),Boyce-Codd Normal Form (BCNF),"A,B,C,D","Remember that normalization progresses through successive stages, each building on the previous one.","Database normalization follows a strict progression: First Normal Form (1NF) eliminates repeating groups, Second Normal Form (2NF) removes partial dependencies, Third Normal Form (3NF) removes transitive dependencies, and Boyce-Codd Normal Form (BCNF) addresses remaining anomalies. This sequence must be followed in order."
Introduction to Database,3,Database Design and Normalization,"Principles of effective database design including entity-relationship modeling, schema design, and normalization techniques. Students will learn to create well-structured databases that minimize redundancy and maintain data integrity.",FITB,"In an Entity-Relationship (ER) model, a _______ represents a thing or object that can have data stored about it.",,,,,entity,Consider what fundamental building blocks are used in ER diagrams to represent things we want to track.,"In an Entity-Relationship (ER) model, an entity is the fundamental unit that represents a distinguishable thing or object in the real world about which we want to collect and store data. Entities are typically represented as rectangles in ER diagrams and form the basis for creating database tables."`;
